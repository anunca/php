upstream _php {
    server unix:/var/run/php-fpm.sock;
}

server {
    listen 80;
    server_name _;

    root /var/www/html;

    include fastcgi_params;

    location / {
        fastcgi_pass _php;
        fastcgi_index index.php;
    }

    location ~ \.php$ {
        fastcgi_pass _php;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
