name: Validate projects

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Check whitespace
        run: git diff --check

      - name: Validate Docker Compose projects
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            echo "::group::$file"
            dir="$(dirname "$file")"
            make -C "$dir" config
            echo "::endgroup::"
          done < <(find . -type f -name 'compose.dev.yml' -print | sort)

  build:
    runs-on: ubuntu-26.04
    needs: repository
    strategy:
      fail-fast: false
      matrix:
        project:
          - amp
          - auto-prepend-file
          - autoload-composer
          - autoload-namespace
          - autoload
          - beta
          - builder
          - cache
          - compil
          - composer-require
          - composer
          - di
          - doctrine
          - efk
          - fibers
          - frankenphp
          - guzzle
          - opcache
          - raw
          - rector
          - router
          - session
          - twig
          - vscode-php
          - xdebug
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.project }}
        env:
          GITHUB_TOKEN: ${{ secrets.COMPOSER_GITHUB_TOKEN }}
        run: make -C "${{ matrix.project }}" build
