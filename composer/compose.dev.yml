services:
  app:
    build:
      target: dev
    volumes:
      - php_vendor:/usr/share/nginx/html/vendor
      - ./src:/usr/share/nginx/html
  web:
    build:
      target: dev
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./src:/usr/share/nginx/html
volumes:
  php_vendor:
