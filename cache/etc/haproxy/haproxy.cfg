global
    # Global settings

defaults
    # Default settings

frontend app
    bind *:80
    use_backend app_servers

default_backend app_servers

backend app_servers
    mode http
    balance roundrobin
    http-response add-header X-Via %[env(HOSTNAME)]
    http-response set-header X-Server webserver
    http-response del-header Server
    http-response del-header X-Powered-By
    server app1 app1:80 check
    server app2 app2:80 check
    server app3 app3:80 check
