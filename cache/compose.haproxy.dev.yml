services:
  app1:
    build:
      target: dev
    volumes:
      - php_vendor:/var/www/html/vendor
      - ./src:/var/www/html
      - ./etc/php/phpinfo.php:/var/www/html/public/phpinfo.php
      - ./etc/php/xdebug/xdebuginfo.php:/var/www/html/public/xdebuginfo.php
      - ./etc/php/opcache.php:/var/www/html/public/opcache.php
    environment:
      - XDEBUG_MODE
