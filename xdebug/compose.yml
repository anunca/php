services:
  web:
    depends_on:
      - app
    image: $NGINX_VERSION
    volumes:
      - ./etc/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./etc/fastcgi_params:/etc/nginx/fastcgi_params
      - var_run:/var/run
    ports:
      - 80:80
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PHP_IMAGE:
    image: $IMAGE
    volumes:
      - ./etc/php-fpm.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
      - var_run:/var/run
    environment:
      MYSQL_USER:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE:
  db:
    image: $MYSQL_VERSION
    volumes:
      - db:/var/lib/mysql
    ports:
      - 3306
    environment:
      MYSQL_ROOT_PASSWORD:
      MYSQL_DATABASE:
    command: --default-authentication-plugin=mysql_native_password
volumes:
  var_run:
  db:
