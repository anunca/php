upstream _php {
    server unix:/var/run/php-fpm.sock;
}

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass _php;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }    

    error_log off;
    access_log off;
}
