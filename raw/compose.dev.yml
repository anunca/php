services:
  web:
    volumes:
      - ./etc/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./src:/var/www/html
  app:
    build:
      target: dev
    volumes:
      - php_vendor:/var/www/html/vendor
      - ./src:/var/www/html
volumes:
  php_vendor:
